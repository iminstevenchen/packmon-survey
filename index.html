<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packmon</title>
<meta name="theme-color" content="#D2693F">
<link rel="icon" href="survey/icons/icon-192.png">
<style>
:root{--bg:#F3E8D8;--ink:#141414;--accent:#D2693F;--surface:#fff;--muted:#5E5348}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:420px;width:100%;background:var(--surface);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);overflow:hidden}
header{background:var(--accent);color:#fff;padding:14px 20px;font-weight:900;font-size:24px}
section{padding:20px}
h1{margin:0 0 8px;font-size:26px;line-height:1.3}
p{margin:0 0 18px;color:var(--muted)}
a.cta{display:block;text-align:center;padding:14px 20px;border:3px solid var(--ink);border-radius:99px;background:var(--accent);color:#fff;font-weight:900;font-size:18px;text-decoration:none;box-shadow:0 5px 0 var(--ink)}
small{display:block;margin-top:18px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
<header>Packmon</header>
<section>
<h1>你的旅行打包夥伴</h1>
<p>依目的地、天數與旅行風格產生打包清單，出發前先提醒海關與航空安檢限制。</p>
<a class="cta" href="survey/">來玩滑一滑問卷</a>
<small>Packmon 提供行前準備與提醒，不是即時的法律或海關建議，出發前請再確認官方最新資訊。</small>
</section>
</main>
</body>
</html>
