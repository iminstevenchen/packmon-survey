<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packmon</title>
<meta name="theme-color" content="#D2693F">
<link rel="icon" href="survey/icons/icon-192.png">
<style>
:root{--bg:#F3E8D8;--ink:#141414;--accent:#D2693F;--surface:#fff;--muted:#5E5348}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:420px;width:100%;background:var(--surface);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);overflow:hidden}
header{background:var(--accent);color:#fff;padding:14px 20px;font-weight:900;font-size:24px}
section{padding:20px}
h1{margin:0 0 8px;font-size:26px;line-height:1.3}
p{margin:0 0 18px;color:var(--muted)}
a.cta{display:block;text-align:center;padding:14px 20px;border:3px solid var(--ink);border-radius:99px;background:var(--accent);color:#fff;font-weight:900;font-size:18px;text-decoration:none;box-shadow:0 5px 0 var(--ink)}
small{display:block;margin-top:18px;color:var(--muted);font-size:12px}
select{position:fixed;top:12px;right:12px;appearance:none;font:inherit;font-weight:800;font-size:14px;padding:6px 14px;border:3px solid var(--ink);border-radius:99px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
</style>
</head>
<body>
<select id="lang" aria-label="Language"><option value="zh">繁體中文</option><option value="cn">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select>
<main>
<header>Packmon</header>
<section>
<h1 data-k="h">你的旅行打包夥伴</h1>
<p data-k="p">依目的地、天數與旅行風格產生打包清單，出發前先提醒海關與航空安檢限制。</p>
<a class="cta" data-k="c" href="survey/">來玩滑一滑問卷</a>
<small data-k="s">Packmon 提供行前準備與提醒，不是即時的法律或海關建議，出發前請再確認官方最新資訊。</small>
</section>
</main>
<script>
var D={
zh:{h:"你的旅行打包夥伴",p:"依目的地、天數與旅行風格產生打包清單，出發前先提醒海關與航空安檢限制。",c:"來玩滑一滑問卷",s:"Packmon 提供行前準備與提醒，不是即時的法律或海關建議，出發前請再確認官方最新資訊。"},
cn:{h:"你的旅行打包伙伴",p:"根据目的地、天数与旅行风格生成打包清单，出发前先提醒海关与航空安检限制。",c:"来玩滑一滑问卷",s:"Packmon 提供行前准备与提醒，不是实时的法律或海关建议，出发前请再确认官方最新信息。"},
en:{h:"Your travel packing buddy",p:"Builds a packing list from your destination, trip length and travel style, and reminds you of customs and airport security limits before you go.",c:"Take the swipe survey",s:"Packmon offers trip preparation and reminders. It is not real-time legal or customs advice, so check official sources before you travel."},
ja:{h:"あなたの旅行荷造りパートナー",p:"目的地・日数・旅のスタイルから荷造りリストを作り、出発前に税関や空港保安検査の制限をお知らせします。",c:"スワイプ調査をやってみる",s:"Packmon は出発前の準備と通知を提供するもので、リアルタイムの法的・税関アドバイスではありません。出発前に公式情報をご確認ください。"},
ko:{h:"나의 여행 짐 싸기 파트너",p:"목적지, 일수, 여행 스타일에 맞춰 짐 목록을 만들고 출발 전에 세관과 공항 보안 검색 제한을 알려 줘요.",c:"스와이프 설문 해보기",s:"Packmon은 출발 전 준비와 알림을 제공하며, 실시간 법률·세관 조언이 아니에요. 출발 전에 공식 정보를 확인하세요."}};
var L=(function(){try{var v=localStorage.getItem("pkm_lang");if(D[v])return v}catch(e){}
var n=((navigator.languages&&navigator.languages[0])||navigator.language||"zh-TW").toLowerCase();
if(/^zh/.test(n))return /hant|tw|hk|mo/.test(n)?"zh":"cn";if(/^ja/.test(n))return"ja";if(/^ko/.test(n))return"ko";return"en"})();
var HL={zh:"zh-Hant",cn:"zh-Hans",en:"en",ja:"ja",ko:"ko"};
function ap(){document.documentElement.lang=HL[L];document.getElementById("lang").value=L;
document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=D[L][e.dataset.k]})}
document.getElementById("lang").onchange=function(){L=this.value;try{localStorage.setItem("pkm_lang",L)}catch(e){}ap()};
ap();
</script>
</body>
</html>
